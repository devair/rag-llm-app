server {
    listen 81;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://rag_app:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

    }

    # SSE (chat com streaming token a token): desativa buffering e timeouts
    # para que os eventos cheguem ao cliente assim que são gerados.
    location /api/chat/stream {
        proxy_pass http://rag_app:3000/api/chat/stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        read_timeout 3600s;
        send_timeout 3600s;
    }
}